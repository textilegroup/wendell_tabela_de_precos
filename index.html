<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGI — Lista de Preços</title>
<meta name="color-scheme" content="light dark">
<script src="https://textilegroup.github.io/wendell-users/guard.js"
        data-app="precos" data-barra="nao"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   WGI — Lista de Preços
   ---------------------------------------------------------------------
   Visual alinhado ao design system oficial WGI (theme.css do repositório
   wendell-users; referência visual: painel "Vendas Wendell Brasil").
   Paleta vinho, tipografia Archivo / Archivo Narrow, header em gradiente
   vinho, cards com cabeçalho de linha vinho, tabelas densas com números
   à direita e dark mode só por tokens.

   Os tokens da primeira seção são idênticos aos de theme.css. Os tokens
   próprios desta ferramenta (famílias de produto, IPI, custo, simulação)
   vêm logo abaixo e sempre têm par claro/escuro, seguindo a mesma lógica.
   Nada de cor solta no corpo do CSS: tudo sai de token.
   ===================================================================== */

/* ===== Tokens — tema claro (idênticos a theme.css) ===== */
:root{
  --wine:#7C1B29; --wine-deep:#5E1220; --wine-soft:#A5303F;
  --bg:#F2F2F0; --card:#FFFFFF; --sunk:#F7F5F3;
  --ink:#26252A; --ink-2:#5A555C; --ink-3:#8B858E;
  --line:#E3E0DD; --line-2:#EFECE9;
  --s1:#9E2438; --s2:#B8801F; --s3:#1E6FB8; --s4:#4E7A1E;
  --pos:#2C6B4F; --neg:#A33A2A; --chip:#F6F4F1;
  --shadow:0 1px 2px rgba(38,37,42,.06),0 1px 8px rgba(38,37,42,.04);

  /* --- tokens próprios desta ferramenta --- */
  /* vinho para TEXTO/contorno sobre o card: no dark o vinho cheio fica
     escuro demais sobre fundo escuro, então lá ele vira o vinho claro.
     Preenchimentos (botões, células escolhidas, header) continuam em --wine. */
  --wine-ink:#7C1B29;
  /* Famílias de produto: nenhum preenchimento colorido. A família é marcada
     só por um filete, sempre na cor do documento — muda a intensidade, nunca
     o matiz. */
  --cat-6-border:var(--wine-ink);
  --cat-7-border:color-mix(in srgb, var(--wine-ink) 74%, var(--ink-3));
  --cat-8-border:color-mix(in srgb, var(--wine-ink) 48%, var(--ink-3));
  --cat-9-border:color-mix(in srgb, var(--wine-ink) 26%, var(--ink-3));
  /* IPI e custo: colunas distinguidas por filete e por tom de texto */
  --ipi-ink:var(--ink-2); --ipi-border:var(--line);
  --cost-ink:var(--ink-3); --cost-border:var(--line);
  /* simulação (só Gerência, nunca no PDF) */
  --sim-bg:#FBF6EA; --sim-bg-on:#F3E8CE; --sim-sel:#2C6B4F;
  /* campos editáveis (coeficientes) */
  --edit-bg:#FBF0C4; --edit-bg-ok:#E9F3DA;
  --overlay:rgba(38,37,42,.55);
}

/* ===== Tokens — tema escuro ===== */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
    --bg:#141316; --card:#1E1C21; --sunk:#26232A;
    --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
    --line:#332F38; --line-2:#2A272F;
    --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0; --s4:#6E9430;
    --pos:#5FA37E; --neg:#D97A62; --chip:#2A272F;
    --shadow:0 1px 2px rgba(0,0,0,.4);

    --cat-6-border:var(--wine-ink);
    --cat-7-border:color-mix(in srgb, var(--wine-ink) 74%, var(--ink-3));
    --cat-8-border:color-mix(in srgb, var(--wine-ink) 48%, var(--ink-3));
    --cat-9-border:color-mix(in srgb, var(--wine-ink) 26%, var(--ink-3));
    --ipi-ink:var(--ink-2); --ipi-border:var(--line);
    --cost-ink:var(--ink-3); --cost-border:var(--line);
    --sim-bg:#282217; --sim-bg-on:#3A3120; --sim-sel:#5FA37E;
    --edit-bg:#3A3120; --edit-bg-ok:#26331D;
    --wine-ink:#C4536A;
    --overlay:rgba(10,9,12,.62);
  }
}
:root[data-theme="dark"]{
  --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
  --bg:#141316; --card:#1E1C21; --sunk:#26232A;
  --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
  --line:#332F38; --line-2:#2A272F;
  --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0; --s4:#6E9430;
  --pos:#5FA37E; --neg:#D97A62; --chip:#2A272F;
  --shadow:0 1px 2px rgba(0,0,0,.4);

  --cat-6-border:var(--wine-ink);
  --cat-7-border:color-mix(in srgb, var(--wine-ink) 74%, var(--ink-3));
  --cat-8-border:color-mix(in srgb, var(--wine-ink) 48%, var(--ink-3));
  --cat-9-border:color-mix(in srgb, var(--wine-ink) 26%, var(--ink-3));
  --ipi-ink:var(--ink-2); --ipi-border:var(--line);
  --cost-ink:var(--ink-3); --cost-border:var(--line);
  --sim-bg:#282217; --sim-bg-on:#3A3120; --sim-sel:#5FA37E;
  --edit-bg:#3A3120; --edit-bg-ok:#26331D;
  --wine-ink:#C4536A;
  --overlay:rgba(10,9,12,.62);
}

/* ===== Base ===== */
*{box-sizing:border-box;}
/* regras de classe vencem o [hidden] do navegador */
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:13px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  min-height:100vh;
}
:focus-visible{outline:2px solid var(--wine-soft); outline-offset:2px;}

/* ===== Header ===== */
.wgi-header{
  background:linear-gradient(100deg,var(--wine-deep) 0%,var(--wine) 62%,var(--wine-deep) 100%);
  color:#fff;
  padding:10px 16px;
  position:sticky; top:0; z-index:40;
}
.header-inner{
  max-width:1560px; margin:0 auto;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:12px; min-width:0;}
.logo-badge{
  width:38px; height:38px; flex:none;
  background:#fff; border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  display:grid; place-items:center;
  padding:3px; overflow:hidden;
}
.logo-badge img{width:100%; height:100%; object-fit:contain;}
.brand-text h1{
  margin:0; font-size:19px; font-weight:700;
  letter-spacing:-.01em; line-height:1.1; color:#fff;
}
.brand-text p{
  margin:1px 0 0; font-size:11px; font-weight:400;
  letter-spacing:.02em; color:#fff; opacity:.78;
}
.header-actions{
  margin-left:auto; display:flex; align-items:center;
  gap:8px; flex-wrap:wrap; justify-content:flex-end;
}
.hdr-chip{
  font:inherit; font-size:11.5px; font-weight:600; letter-spacing:.03em;
  border:1px solid rgba(255,255,255,.35); border-radius:8px;
  padding:5px 10px; background:rgba(255,255,255,.07); color:#fff;
  cursor:pointer; white-space:nowrap;
}
.hdr-chip:hover{background:rgba(255,255,255,.16);}
/* O chip de Custos é um link, não um botão: precisa anular o sublinhado e
   alinhar o ícone de "abre em outra aba" ao texto. */
.hdr-chip.hdr-link{
  display:inline-flex; align-items:center; gap:5px;
  text-decoration:none;
}
.hdr-chip.hdr-link .ico{opacity:.8;}
.hdr-chip.hdr-link:hover .ico{opacity:1;}
.hdr-chip[hidden]{display:none !important;}
.clock-pill{
  font:inherit; font-size:11.5px; font-weight:600; letter-spacing:.03em;
  border:1px solid rgba(255,255,255,.35); border-radius:8px;
  padding:5px 10px; background:rgba(255,255,255,.07); color:#fff;
  white-space:nowrap;
}
.lang-toggle{
  display:flex; border:1px solid rgba(255,255,255,.35);
  border-radius:8px; overflow:hidden;
}
.lang-toggle button{
  font:inherit; font-size:11.5px; font-weight:700; letter-spacing:.05em;
  padding:5px 10px; border:0; background:transparent;
  color:rgba(255,255,255,.72); cursor:pointer;
}
.lang-toggle button.active,
.lang-toggle button[aria-pressed="true"]{background:#fff; color:var(--wine-deep);}

/* ===== Shell ===== */
.page{
  max-width:1560px; margin:0 auto;
  padding:12px 16px 40px;
  display:flex; flex-direction:column; gap:12px;
  transition:max-width .18s ease;
}
/* Com o grupo de simulação aberto surgem colunas a mais: a página se alarga
   para aproveitar a tela antes de precisar encolher a tabela. */
.page.wide{ max-width:min(1800px,98vw); padding-left:12px; padding-right:12px; }

/* ===== Card / painel =====
   O cabeçalho usa margens negativas para encostar nas bordas do card, como
   o .card-hd do design system, sem exigir um wrapper .card-bd no HTML. */
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:11px 14px 13px;
  margin:0;
}
.panel-title-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap;
  margin:-11px -14px 11px;
  padding:9px 14px 8px;
  border-bottom:2px solid var(--wine-soft);
}
.panel-title{
  margin:0; font:inherit; font-size:12px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--wine-ink);
}

/* ===== Campos ===== */
.field-row{display:flex; flex-wrap:wrap; gap:12px 18px; align-items:flex-end;}
.field{display:flex; flex-direction:column; gap:5px; min-width:0; flex:0 0 auto;}
.field.grow{flex:1 1 210px;}
.field-label{
  font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3);
}
.field-hint{font-size:11px; color:var(--ink-3); margin-top:1px;}

.segmented{
  display:inline-flex; background:var(--chip);
  border:1px solid var(--line); border-radius:8px;
  padding:2px; gap:2px;
}
.segmented button{
  font:inherit; font-size:12px; font-weight:600;
  border:0; background:transparent; color:var(--ink-2);
  padding:5px 11px; border-radius:6px; cursor:pointer;
  white-space:nowrap; transition:background .15s ease, color .15s ease;
}
.segmented button.active,
.segmented button[aria-pressed="true"]{background:var(--wine); color:#fff;}
.segmented button:hover:not(.active){color:var(--ink);}
.segmented button.locked::after{
  content:""; display:inline-block; width:11px; height:11px;
  margin-left:5px; vertical-align:-1px; background:currentColor;
  -webkit-mask:var(--mask-lock) center/contain no-repeat;
  mask:var(--mask-lock) center/contain no-repeat;
}
.segmented.disabled{opacity:.45; pointer-events:none;}

.chipset{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  font:inherit; font-size:12px; font-weight:600;
  border:1px solid var(--line); background:var(--chip); color:var(--ink-2);
  padding:5px 11px; border-radius:8px; cursor:pointer;
  white-space:nowrap; transition:background .15s ease, color .15s ease;
}
.chip:hover:not(.active){background:var(--sunk); color:var(--ink);}
.chip.active{background:var(--wine); border-color:var(--wine); color:#fff;}

.input-box{
  font:inherit; font-size:12.5px; color:var(--ink);
  background:var(--card); border:1px solid var(--line);
  border-radius:8px; padding:6px 9px; width:100%;
}
.input-box::placeholder{color:var(--ink-3);}
.input-box:focus{outline:2px solid var(--wine-soft); outline-offset:-1px; border-color:var(--wine-soft);}
select.input-box{cursor:pointer;}

.status-pill{
  font-size:11px; font-weight:600; color:var(--ink-2);
  background:var(--chip); border:1px solid var(--line);
  padding:6px 11px; border-radius:8px;
  display:inline-flex; gap:6px; align-items:center;
}
.status-pill.gerencia{
  color:var(--wine-ink);
  background:color-mix(in srgb, var(--wine) 9%, transparent);
  border-color:color-mix(in srgb, var(--wine) 30%, transparent);
}

/* ===== Botões ===== */
.btn{
  font:inherit; font-size:11.5px; font-weight:700; letter-spacing:.04em;
  border:1px solid transparent; border-radius:8px;
  padding:7px 13px; cursor:pointer; white-space:nowrap;
}
.btn-primary{background:var(--wine); border-color:var(--wine); color:#fff;}
.btn-primary:hover{background:var(--wine-soft); border-color:var(--wine-soft);}
.btn-ghost{background:var(--chip); border-color:var(--line); color:var(--ink-2);}
.btn-ghost:hover{background:var(--sunk); color:var(--ink);}
.btn-outline{background:transparent; border-color:var(--wine-ink); color:var(--wine-ink);}
.btn-outline:hover{background:var(--wine); color:#fff;}
.btn:disabled, .btn-primary:disabled{opacity:.5; cursor:not-allowed; pointer-events:none;}

/* ===== Áreas administrativas =====
   No design system a área ADM/custos usa o âmbar (--s2) no lugar do vinho,
   para separar visualmente do que o representante vê. */
.admin-panel .panel-title-row{border-bottom-color:var(--s2);}
.admin-panel .panel-title{color:var(--s2);}
.admin-hint{font-size:11px; color:var(--ink-3); line-height:1.45; margin:0 0 11px;}
.admin-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.file-btn{position:relative; overflow:hidden;}
.file-btn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
.admin-msg{font-size:11.5px; font-weight:600; margin-top:10px;}
.admin-msg.ok{color:var(--pos);}
.admin-msg.err{color:var(--neg);}

/* ===== Coeficientes de venda ===== */
.coef-tabs{
  display:flex; flex-wrap:wrap; gap:3px;
  margin:0 0 12px; border-bottom:1px solid var(--line);
}
.coef-tab{
  font:inherit; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; padding:7px 11px;
  border:1px solid transparent; border-bottom:0; background:transparent;
  color:var(--ink-3); border-radius:8px 8px 0 0; cursor:pointer; margin-bottom:-1px;
}
.coef-tab:hover:not(.active){color:var(--ink-2); background:var(--sunk);}
.coef-tab.active{
  background:var(--card); border-color:var(--line); color:var(--s2);
  box-shadow:inset 0 2px 0 var(--s2);
}

/* ICMS e PIS/COFINS valem para a versão inteira: ficam em uma faixa ACIMA
   da tabela (economiza largura). A tabela usa table-layout fixo e colunas
   estreitas para caber na tela — inclusive no celular — sem rolagem. */
.coef-wrap{display:block; max-width:100%;}
.coef-scroll{overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch;}
.coef-top{
  display:flex; flex-wrap:wrap; gap:9px 14px; align-items:flex-end;
  margin:0 0 11px; padding:9px 11px;
  background:var(--sunk); border:1px solid var(--line); border-radius:9px;
}
.coef-top-field{display:flex; flex-direction:column; gap:4px;}
.coef-top-field > span{
  font-size:9.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3);
}
.coef-top-field input{
  width:92px; font:inherit; font-size:12.5px; font-weight:700;
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif;
  background:var(--edit-bg); color:var(--ink);
  border:1px solid var(--line); border-radius:6px;
  padding:5px 6px; text-align:center;
}
.coef-top-field input:focus{outline:2px solid var(--s2); outline-offset:-1px;}
.coef-top-note{font-size:10.5px; color:var(--ink-3); align-self:center; margin-left:auto;}

table.coef-table{
  border-collapse:separate; border-spacing:0;
  background:var(--card); border:1px solid var(--line);
  border-radius:9px; overflow:hidden;
  width:100%; min-width:0; table-layout:fixed;
}
table.coef-table th, table.coef-table td{
  border-bottom:1px solid var(--line-2); border-right:1px solid var(--line-2);
  padding:5px 3px; font-size:11.5px; text-align:center; color:var(--ink);
}
table.coef-table thead th{
  background:var(--sunk); color:var(--ink-3);
  font-weight:700; font-size:9.5px; letter-spacing:.06em;
  text-transform:uppercase; padding:6px 2px;
  border-bottom:1px solid var(--line);
}
table.coef-table tbody th{
  background:var(--sunk); text-align:left; font-weight:700; color:var(--ink);
  white-space:normal; font-size:10.5px; line-height:1.2; padding:5px 7px; width:86px;
}
table.coef-table col.coef-rowhead{width:86px;}
table.coef-table input{
  width:100%; max-width:120px; min-width:0; box-sizing:border-box;
  font:inherit; font-size:11.5px;
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif; font-weight:600;
  color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:5px;
  padding:4px 2px; text-align:center;
}
table.coef-table input:focus{outline:2px solid var(--s2); outline-offset:-1px;}
td.coef-yellow{background:var(--edit-bg-ok);}
td.coef-yellow input{background:var(--edit-bg-ok);}
td.coef-readonly{background:var(--sunk); color:var(--ink-2); font-weight:600;}
@media (max-width:560px){
  table.coef-table th, table.coef-table td{padding:4px 2px; font-size:10.5px;}
  table.coef-table thead th{font-size:8.5px;}
  table.coef-table tbody th{width:64px; font-size:9.5px; padding:4px 5px;}
  table.coef-table col.coef-rowhead{width:64px;}
  table.coef-table input{font-size:10.5px; padding:3px 1px;}
  .coef-top-field input{width:78px;}
}
.coef-hint{font-size:11px; color:var(--ink-3); margin:11px 0 0; line-height:1.45;}
.coef-reset{margin-top:0;}

/* ===== Conteúdo / tabelas ===== */
.print-summary{display:none;}
.print-summary .icms-badge{
  display:inline-block; background:var(--wine); color:#fff;
  padding:3px 14px; border-radius:6px; font-weight:700;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.cat-block{
  --cat-accent:var(--wine-ink);
  margin:0 0 12px; padding:0;
  width:max-content; max-width:100%; overflow:visible;
  border:1px solid var(--line);
  border-left:2px solid var(--cat-accent);
  border-radius:10px;
}
.cat-heading{
  display:flex; align-items:baseline; gap:9px;
  margin:0; padding:5px 11px 4px;
  /* Congelado na rolagem, logo abaixo do header fixo. O deslocamento vem de
     --cat-sticky-top, que o JS recalcula por bloco: no celular o bloco pode
     estar sob zoom, e aí o top precisa ser dividido pela escala. */
  position:sticky; z-index:5;
  top:var(--cat-sticky-top, var(--hdr-h, 58px));
  background:var(--card);
  border-bottom:1px solid var(--line);
}
/* Sem overflow:hidden no card, o fundo da última linha encostaria no canto
   quadrado; o arredondamento passa para ela. */
.price-table tbody tr:last-child td:first-child{border-bottom-left-radius:9px;}
.price-table tbody tr:last-child td:last-child{border-bottom-right-radius:9px;}
.cat-heading h2{
  margin:0; font:inherit; font-size:11px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--cat-accent);
}
.cat-count{
  margin-left:auto; padding-left:24px;
  font-size:10px; color:var(--ink-2); letter-spacing:.03em;
  font-variant-numeric:tabular-nums;
}

/* Cada família de produtos é identificada apenas pelo filete da esquerda e
   pelo tom do título. Sem faixa de fundo em lugar nenhum. */
.cat-block[data-catcolor="6"]{--cat-accent:var(--cat-6-border);}
.cat-block[data-catcolor="7"]{--cat-accent:var(--cat-7-border);}
.cat-block[data-catcolor="8"]{--cat-accent:var(--cat-8-border);}
.cat-block[data-catcolor="9"]{--cat-accent:var(--cat-9-border);}

/* ===== Tabela de preços =====
   Colunas justas ao texto: a tabela tem a largura do próprio conteúdo e o
   card acompanha (.cat-block é width:max-content). Nada de esticar "Cor" ou
   os preços só porque sobra tela. Os poucos valores em ch abaixo existem
   para que todas as famílias fiquem com as MESMAS colunas — sem eles, cada
   tabela teria uma largura, e a borda direita dos cards ficaria irregular. */
table.price-table{
  width:auto; table-layout:auto;
  border-collapse:separate; border-spacing:0;
  background:transparent;
  border:0; border-radius:0;
  font-size:12px;
}
/* Cada tipo de coluna tem um piso em px, calculado para caber o conteúdo mais
   largo do catálogo. Como o piso é maior que o conteúdo de qualquer família,
   todas as tabelas saem com as MESMAS colunas e a borda direita dos cards fica
   alinhada. Em px, não em ch: o ch de um th (9,5px) é outro tamanho do ch de
   uma célula (12px), e o cálculo viraria adivinhação. */
