<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGI — Lista de Preços</title>
<meta name="color-scheme" content="light dark">
<script src="https://textilegroup.github.io/wendell-users/guard.js"
        data-app="precos" data-barra="nao"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   WGI — Lista de Preços
   ---------------------------------------------------------------------
   Visual alinhado ao design system oficial WGI (theme.css do repositório
   wendell-users; referência visual: painel "Vendas Wendell Brasil").
   Paleta vinho, tipografia Archivo / Archivo Narrow, header em gradiente
   vinho, cards com cabeçalho de linha vinho, tabelas densas com números
   à direita e dark mode só por tokens.

   Os tokens da primeira seção são idênticos aos de theme.css. Os tokens
   próprios desta ferramenta (famílias de produto, IPI, custo, simulação)
   vêm logo abaixo e sempre têm par claro/escuro, seguindo a mesma lógica.
   Nada de cor solta no corpo do CSS: tudo sai de token.
   ===================================================================== */

/* ===== Tokens — tema claro (idênticos a theme.css) ===== */
:root{
  --wine:#7C1B29; --wine-deep:#5E1220; --wine-soft:#A5303F;
  --bg:#F2F2F0; --card:#FFFFFF; --sunk:#F7F5F3;
  --ink:#26252A; --ink-2:#5A555C; --ink-3:#8B858E;
  --line:#E3E0DD; --line-2:#EFECE9;
  --s1:#9E2438; --s2:#B8801F; --s3:#1E6FB8; --s4:#4E7A1E;
  --pos:#2C6B4F; --neg:#A33A2A; --chip:#F6F4F1;
  --shadow:0 1px 2px rgba(38,37,42,.06),0 1px 8px rgba(38,37,42,.04);

  /* --- tokens próprios desta ferramenta --- */
  /* vinho para TEXTO/contorno sobre o card: no dark o vinho cheio fica
     escuro demais sobre fundo escuro, então lá ele vira o vinho claro.
     Preenchimentos (botões, células escolhidas, header) continuam em --wine. */
  --wine-ink:#7C1B29;
  /* Famílias de produto: nenhum preenchimento colorido. A família é marcada
     só por um filete, sempre na cor do documento — muda a intensidade, nunca
     o matiz. */
  --cat-6-border:var(--wine-ink);
  --cat-7-border:color-mix(in srgb, var(--wine-ink) 74%, var(--ink-3));
  --cat-8-border:color-mix(in srgb, var(--wine-ink) 48%, var(--ink-3));
  --cat-9-border:color-mix(in srgb, var(--wine-ink) 26%, var(--ink-3));
  /* IPI e custo: colunas distinguidas por filete e por tom de texto */
  --ipi-ink:var(--ink-2); --ipi-border:var(--line);
  --cost-ink:var(--ink-3); --cost-border:var(--line);
  /* simulação (só Gerência, nunca no PDF) */
  --sim-bg:#FBF6EA; --sim-bg-on:#F3E8CE; --sim-sel:#2C6B4F;
  /* campos editáveis (coeficientes) */
  --edit-bg:#FBF0C4; --edit-bg-ok:#E9F3DA;
  --overlay:rgba(38,37,42,.55);
}

/* ===== Tokens — tema escuro ===== */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
    --bg:#141316; --card:#1E1C21; --sunk:#26232A;
    --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
    --line:#332F38; --line-2:#2A272F;
    --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0; --s4:#6E9430;
    --pos:#5FA37E; --neg:#D97A62; --chip:#2A272F;
    --shadow:0 1px 2px rgba(0,0,0,.4);

    --cat-6-border:var(--wine-ink);
    --cat-7-border:color-mix(in srgb, var(--wine-ink) 74%, var(--ink-3));
    --cat-8-border:color-mix(in srgb, var(--wine-ink) 48%, var(--ink-3));
    --cat-9-border:color-mix(in srgb, var(--wine-ink) 26%, var(--ink-3));
    --ipi-ink:var(--ink-2); --ipi-border:var(--line);
    --cost-ink:var(--ink-3); --cost-border:var(--line);
    --sim-bg:#282217; --sim-bg-on:#3A3120; --sim-sel:#5FA37E;
    --edit-bg:#3A3120; --edit-bg-ok:#26331D;
    --wine-ink:#C4536A;
    --overlay:rgba(10,9,12,.62);
  }
}
:root[data-theme="dark"]{
  --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
  --bg:#141316; --card:#1E1C21; --sunk:#26232A;
  --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
  --line:#332F38; --line-2:#2A272F;
  --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0; --s4:#6E9430;
  --pos:#5FA37E; --neg:#D97A62; --chip:#2A272F;
  --shadow:0 1px 2px rgba(0,0,0,.4);

  --cat-6-border:var(--wine-ink);
  --cat-7-border:color-mix(in srgb, var(--wine-ink) 74%, var(--ink-3));
  --cat-8-border:color-mix(in srgb, var(--wine-ink) 48%, var(--ink-3));
  --cat-9-border:color-mix(in srgb, var(--wine-ink) 26%, var(--ink-3));
  --ipi-ink:var(--ink-2); --ipi-border:var(--line);
  --cost-ink:var(--ink-3); --cost-border:var(--line);
  --sim-bg:#282217; --sim-bg-on:#3A3120; --sim-sel:#5FA37E;
  --edit-bg:#3A3120; --edit-bg-ok:#26331D;
  --wine-ink:#C4536A;
  --overlay:rgba(10,9,12,.62);
}

/* ===== Base ===== */
*{box-sizing:border-box;}
/* regras de classe vencem o [hidden] do navegador */
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:13px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  min-height:100vh;
}
:focus-visible{outline:2px solid var(--wine-soft); outline-offset:2px;}

/* ===== Header ===== */
.wgi-header{
  background:linear-gradient(100deg,var(--wine-deep) 0%,var(--wine) 62%,var(--wine-deep) 100%);
  color:#fff;
  padding:10px 16px;
  position:sticky; top:0; z-index:40;
}
.header-inner{
  max-width:1560px; margin:0 auto;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:12px; min-width:0;}
.logo-badge{
  width:38px; height:38px; flex:none;
  background:#fff; border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
  display:grid; place-items:center;
  padding:3px; overflow:hidden;
}
.logo-badge img{width:100%; height:100%; object-fit:contain;}
.brand-text h1{
  margin:0; font-size:19px; font-weight:700;
  letter-spacing:-.01em; line-height:1.1; color:#fff;
}
.brand-text p{
  margin:1px 0 0; font-size:11px; font-weight:400;
  letter-spacing:.02em; color:#fff; opacity:.78;
}
.header-actions{
  margin-left:auto; display:flex; align-items:center;
  gap:8px; flex-wrap:wrap; justify-content:flex-end;
}
.hdr-chip{
  font:inherit; font-size:11.5px; font-weight:600; letter-spacing:.03em;
  border:1px solid rgba(255,255,255,.35); border-radius:8px;
  padding:5px 10px; background:rgba(255,255,255,.07); color:#fff;
  cursor:pointer; white-space:nowrap;
}
.hdr-chip:hover{background:rgba(255,255,255,.16);}
/* O chip de Custos é um link, não um botão: precisa anular o sublinhado e
   alinhar o ícone de "abre em outra aba" ao texto. */
.hdr-chip.hdr-link{
  display:inline-flex; align-items:center; gap:5px;
  text-decoration:none;
}
.hdr-chip.hdr-link .ico{opacity:.8;}
.hdr-chip.hdr-link:hover .ico{opacity:1;}
.hdr-chip[hidden]{display:none !important;}
.clock-pill{
  font:inherit; font-size:11.5px; font-weight:600; letter-spacing:.03em;
  border:1px solid rgba(255,255,255,.35); border-radius:8px;
  padding:5px 10px; background:rgba(255,255,255,.07); color:#fff;
  white-space:nowrap;
}
.lang-toggle{
  display:flex; border:1px solid rgba(255,255,255,.35);
  border-radius:8px; overflow:hidden;
}
.lang-toggle button{
  font:inherit; font-size:11.5px; font-weight:700; letter-spacing:.05em;
  padding:5px 10px; border:0; background:transparent;
  color:rgba(255,255,255,.72); cursor:pointer;
}
.lang-toggle button.active,
.lang-toggle button[aria-pressed="true"]{background:#fff; color:var(--wine-deep);}

/* ===== Shell ===== */
.page{
  max-width:1560px; margin:0 auto;
  padding:12px 16px 40px;
  display:flex; flex-direction:column; gap:12px;
  transition:max-width .18s ease;
}
/* Com o grupo de simulação aberto surgem colunas a mais: a página se alarga
   para aproveitar a tela antes de precisar encolher a tabela. */
.page.wide{ max-width:min(1800px,98vw); padding-left:12px; padding-right:12px; }

/* ===== Card / painel =====
   O cabeçalho usa margens negativas para encostar nas bordas do card, como
   o .card-hd do design system, sem exigir um wrapper .card-bd no HTML. */
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:11px 14px 13px;
  margin:0;
}
.panel-title-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap;
  margin:-11px -14px 11px;
  padding:9px 14px 8px;
  border-bottom:2px solid var(--wine-soft);
}
.panel-title{
  margin:0; font:inherit; font-size:12px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--wine-ink);
}

/* ===== Campos ===== */
.field-row{display:flex; flex-wrap:wrap; gap:12px 18px; align-items:flex-end;}
.field{display:flex; flex-direction:column; gap:5px; min-width:0; flex:0 0 auto;}
.field.grow{flex:1 1 210px;}
.field-label{
  font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3);
}
.field-hint{font-size:11px; color:var(--ink-3); margin-top:1px;}

.segmented{
  display:inline-flex; background:var(--chip);
  border:1px solid var(--line); border-radius:8px;
  padding:2px; gap:2px;
}
.segmented button{
  font:inherit; font-size:12px; font-weight:600;
  border:0; background:transparent; color:var(--ink-2);
  padding:5px 11px; border-radius:6px; cursor:pointer;
  white-space:nowrap; transition:background .15s ease, color .15s ease;
}
.segmented button.active,
.segmented button[aria-pressed="true"]{background:var(--wine); color:#fff;}
.segmented button:hover:not(.active){color:var(--ink);}
.segmented button.locked::after{
  content:""; display:inline-block; width:11px; height:11px;
  margin-left:5px; vertical-align:-1px; background:currentColor;
  -webkit-mask:var(--mask-lock) center/contain no-repeat;
  mask:var(--mask-lock) center/contain no-repeat;
}
.segmented.disabled{opacity:.45; pointer-events:none;}

.chipset{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  font:inherit; font-size:12px; font-weight:600;
  border:1px solid var(--line); background:var(--chip); color:var(--ink-2);
  padding:5px 11px; border-radius:8px; cursor:pointer;
  white-space:nowrap; transition:background .15s ease, color .15s ease;
}
.chip:hover:not(.active){background:var(--sunk); color:var(--ink);}
.chip.active{background:var(--wine); border-color:var(--wine); color:#fff;}

.input-box{
  font:inherit; font-size:12.5px; color:var(--ink);
  background:var(--card); border:1px solid var(--line);
  border-radius:8px; padding:6px 9px; width:100%;
}
.input-box::placeholder{color:var(--ink-3);}
.input-box:focus{outline:2px solid var(--wine-soft); outline-offset:-1px; border-color:var(--wine-soft);}
select.input-box{cursor:pointer;}

.status-pill{
  font-size:11px; font-weight:600; color:var(--ink-2);
  background:var(--chip); border:1px solid var(--line);
  padding:6px 11px; border-radius:8px;
  display:inline-flex; gap:6px; align-items:center;
}
.status-pill.gerencia{
  color:var(--wine-ink);
  background:color-mix(in srgb, var(--wine) 9%, transparent);
  border-color:color-mix(in srgb, var(--wine) 30%, transparent);
}

/* ===== Botões ===== */
.btn{
  font:inherit; font-size:11.5px; font-weight:700; letter-spacing:.04em;
  border:1px solid transparent; border-radius:8px;
  padding:7px 13px; cursor:pointer; white-space:nowrap;
}
.btn-primary{background:var(--wine); border-color:var(--wine); color:#fff;}
.btn-primary:hover{background:var(--wine-soft); border-color:var(--wine-soft);}
.btn-ghost{background:var(--chip); border-color:var(--line); color:var(--ink-2);}
.btn-ghost:hover{background:var(--sunk); color:var(--ink);}
.btn-outline{background:transparent; border-color:var(--wine-ink); color:var(--wine-ink);}
.btn-outline:hover{background:var(--wine); color:#fff;}
.btn:disabled, .btn-primary:disabled{opacity:.5; cursor:not-allowed; pointer-events:none;}

/* ===== Áreas administrativas =====
   No design system a área ADM/custos usa o âmbar (--s2) no lugar do vinho,
   para separar visualmente do que o representante vê. */
.admin-panel .panel-title-row{border-bottom-color:var(--s2);}
.admin-panel .panel-title{color:var(--s2);}
.admin-hint{font-size:11px; color:var(--ink-3); line-height:1.45; margin:0 0 11px;}
.admin-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.file-btn{position:relative; overflow:hidden;}
.file-btn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
.admin-msg{font-size:11.5px; font-weight:600; margin-top:10px;}
.admin-msg.ok{color:var(--pos);}
.admin-msg.err{color:var(--neg);}

/* ===== Coeficientes de venda ===== */
.coef-tabs{
  display:flex; flex-wrap:wrap; gap:3px;
  margin:0 0 12px; border-bottom:1px solid var(--line);
}
.coef-tab{
  font:inherit; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; padding:7px 11px;
  border:1px solid transparent; border-bottom:0; background:transparent;
  color:var(--ink-3); border-radius:8px 8px 0 0; cursor:pointer; margin-bottom:-1px;
}
.coef-tab:hover:not(.active){color:var(--ink-2); background:var(--sunk);}
.coef-tab.active{
  background:var(--card); border-color:var(--line); color:var(--s2);
  box-shadow:inset 0 2px 0 var(--s2);
}

/* ICMS e PIS/COFINS valem para a versão inteira: ficam em uma faixa ACIMA
   da tabela (economiza largura). A tabela usa table-layout fixo e colunas
   estreitas para caber na tela — inclusive no celular — sem rolagem. */
.coef-wrap{display:block; max-width:100%;}
.coef-scroll{overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch;}
.coef-top{
  display:flex; flex-wrap:wrap; gap:9px 14px; align-items:flex-end;
  margin:0 0 11px; padding:9px 11px;
  background:var(--sunk); border:1px solid var(--line); border-radius:9px;
}
.coef-top-field{display:flex; flex-direction:column; gap:4px;}
.coef-top-field > span{
  font-size:9.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3);
}
.coef-top-field input{
  width:92px; font:inherit; font-size:12.5px; font-weight:700;
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif;
  background:var(--edit-bg); color:var(--ink);
  border:1px solid var(--line); border-radius:6px;
  padding:5px 6px; text-align:center;
}
.coef-top-field input:focus{outline:2px solid var(--s2); outline-offset:-1px;}
.coef-top-note{font-size:10.5px; color:var(--ink-3); align-self:center; margin-left:auto;}

table.coef-table{
  border-collapse:separate; border-spacing:0;
  background:var(--card); border:1px solid var(--line);
  border-radius:9px; overflow:hidden;
  width:100%; min-width:0; table-layout:fixed;
}
table.coef-table th, table.coef-table td{
  border-bottom:1px solid var(--line-2); border-right:1px solid var(--line-2);
  padding:5px 3px; font-size:11.5px; text-align:center; color:var(--ink);
}
table.coef-table thead th{
  background:var(--sunk); color:var(--ink-3);
  font-weight:700; font-size:9.5px; letter-spacing:.06em;
  text-transform:uppercase; padding:6px 2px;
  border-bottom:1px solid var(--line);
}
table.coef-table tbody th{
  background:var(--sunk); text-align:left; font-weight:700; color:var(--ink);
  white-space:normal; font-size:10.5px; line-height:1.2; padding:5px 7px; width:86px;
}
table.coef-table col.coef-rowhead{width:86px;}
table.coef-table input{
  width:100%; max-width:120px; min-width:0; box-sizing:border-box;
  font:inherit; font-size:11.5px;
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif; font-weight:600;
  color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:5px;
  padding:4px 2px; text-align:center;
}
table.coef-table input:focus{outline:2px solid var(--s2); outline-offset:-1px;}
td.coef-yellow{background:var(--edit-bg-ok);}
td.coef-yellow input{background:var(--edit-bg-ok);}
td.coef-readonly{background:var(--sunk); color:var(--ink-2); font-weight:600;}
@media (max-width:560px){
  table.coef-table th, table.coef-table td{padding:4px 2px; font-size:10.5px;}
  table.coef-table thead th{font-size:8.5px;}
  table.coef-table tbody th{width:64px; font-size:9.5px; padding:4px 5px;}
  table.coef-table col.coef-rowhead{width:64px;}
  table.coef-table input{font-size:10.5px; padding:3px 1px;}
  .coef-top-field input{width:78px;}
}
.coef-hint{font-size:11px; color:var(--ink-3); margin:11px 0 0; line-height:1.45;}
.coef-reset{margin-top:0;}

/* ===== Conteúdo / tabelas ===== */
.print-summary{display:none;}
.print-summary .icms-badge{
  display:inline-block; background:var(--wine); color:#fff;
  padding:3px 14px; border-radius:6px; font-weight:700;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.cat-block{
  --cat-accent:var(--wine-ink);
  margin:0 0 12px; padding:0;
  width:max-content; max-width:100%; overflow:visible;
  border:1px solid var(--line);
  border-left:2px solid var(--cat-accent);
  border-radius:10px;
}
.cat-heading{
  display:flex; align-items:baseline; gap:9px;
  margin:0; padding:5px 11px 4px;
  /* Congelado na rolagem, logo abaixo do header fixo. O deslocamento vem de
     --cat-sticky-top, que o JS recalcula por bloco: no celular o bloco pode
     estar sob zoom, e aí o top precisa ser dividido pela escala. */
  position:sticky; z-index:5;
  top:var(--cat-sticky-top, var(--hdr-h, 58px));
  background:var(--card);
  border-bottom:1px solid var(--line);
}
/* Sem overflow:hidden no card, o fundo da última linha encostaria no canto
   quadrado; o arredondamento passa para ela. */
.price-table tbody tr:last-child td:first-child{border-bottom-left-radius:9px;}
.price-table tbody tr:last-child td:last-child{border-bottom-right-radius:9px;}
.cat-heading h2{
  margin:0; font:inherit; font-size:11px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--cat-accent);
}
.cat-count{
  margin-left:auto; padding-left:24px;
  font-size:10px; color:var(--ink-2); letter-spacing:.03em;
  font-variant-numeric:tabular-nums;
}

/* Cada família de produtos é identificada apenas pelo filete da esquerda e
   pelo tom do título. Sem faixa de fundo em lugar nenhum. */
.cat-block[data-catcolor="6"]{--cat-accent:var(--cat-6-border);}
.cat-block[data-catcolor="7"]{--cat-accent:var(--cat-7-border);}
.cat-block[data-catcolor="8"]{--cat-accent:var(--cat-8-border);}
.cat-block[data-catcolor="9"]{--cat-accent:var(--cat-9-border);}

/* ===== Tabela de preços =====
   Colunas justas ao texto: a tabela tem a largura do próprio conteúdo e o
   card acompanha (.cat-block é width:max-content). Nada de esticar "Cor" ou
   os preços só porque sobra tela. Os poucos valores em ch abaixo existem
   para que todas as famílias fiquem com as MESMAS colunas — sem eles, cada
   tabela teria uma largura, e a borda direita dos cards ficaria irregular. */
table.price-table{
  width:auto; table-layout:auto;
  border-collapse:separate; border-spacing:0;
  background:transparent;
  border:0; border-radius:0;
  font-size:12px;
}
/* Cada tipo de coluna tem um piso em px, calculado para caber o conteúdo mais
   largo do catálogo. Como o piso é maior que o conteúdo de qualquer família,
   todas as tabelas saem com as MESMAS colunas e a borda direita dos cards fica
   alinhada. Em px, não em ch: o ch de um th (9,5px) é outro tamanho do ch de
   uma célula (12px), e o cálculo viraria adivinhação. */
.price-table th.code-col{min-width:132px;}                     /* código: 7GCP120HPF 0100 */
.price-table th.color-col{min-width:110px;}                    /* cor: Branco Óptico */
.price-table th:not(.left):not(.ipi-col):not(.cost-col):not(.sim-col):not(.adm-col){min-width:74px;}
.price-table th.cost-col{min-width:74px;}
.price-table th.ipi-col{min-width:58px;}
.price-table thead th{
  background:transparent; color:var(--ink-2);
  font:inherit; font-size:9.5px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  text-align:right; padding:5px 10px 4px; white-space:nowrap;
  border-bottom:1px solid var(--line);
  vertical-align:bottom;
}
.price-table thead th.left{text-align:left;}
.price-table thead th .tier-pct{
  display:block; font-size:10px; font-weight:700;
  letter-spacing:.02em; color:var(--cat-accent); margin-top:1px;
}
.price-table tbody td{
  padding:5px 10px; text-align:right; white-space:nowrap;
  border-top:1px solid var(--line-2);
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif;
  font-weight:500; color:var(--ink);
}
.price-table tbody tr:first-child td{border-top:0;}
.price-table tbody td.code,
.price-table tbody td.color-cell,
.price-table tbody td.commission-label{text-align:left;}
/* O peso base 500 das linhas não pode apagar o destaque do código, do preço
   e dos números com tom próprio: eles precisam de especificidade equivalente. */
.price-table tbody td.code,
.price-table tbody td.price,
.price-table tbody td.ipi,
.price-table tbody td.sim-margin,
.price-table tbody td.sim-out{font-weight:700;}
.price-table tbody td.cost-col{font-weight:600;}
/* Zebra discreta: um véu de tinta, não uma barra. */
.price-table tbody tr:nth-child(even) td{
  background:color-mix(in srgb, var(--ink) 2.5%, transparent);
}
.price-table tbody tr:hover td{background:color-mix(in srgb, var(--wine) 5%, transparent);}

/* Comissões abaixo dos produtos, na própria tabela, respeitando as colunas */
.price-table tbody tr.commission-row td{
  background:transparent;
  border-top:1px solid var(--line);
  padding-top:7px; padding-bottom:8px;
  font-weight:700; color:var(--cat-accent);
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
tr.commission-row td.commission-label{
  text-align:left; text-transform:uppercase;
  font-size:9.5px; font-weight:700; letter-spacing:.08em;
  font-family:"Archivo",Arial,sans-serif; color:var(--ink-2);
}
tr.commission-row td.commission-value{text-align:right;}

td.code{
  font-family:"Archivo",Arial,sans-serif;
  font-weight:700; font-size:12px; color:var(--ink); white-space:nowrap;
  letter-spacing:.01em;
}
td.color-cell{
  font-family:"Archivo",Arial,sans-serif;
  font-size:11.5px; color:var(--ink-2); white-space:nowrap;
}
td.color-cell .swatch{
  display:inline-block; width:8px; height:8px; border-radius:50%;
  margin-right:6px; border:1px solid var(--line); vertical-align:middle;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
td.price{font-size:12.5px; font-weight:700; text-align:right; white-space:nowrap;}

/* IPI: sem fundo — só um filete de separação e o texto em tom secundário */
td.ipi{
  text-align:right; font-size:12px; font-weight:700; white-space:nowrap;
  color:var(--ipi-ink); background:transparent;
  border-left:1px solid var(--ipi-border);
}
th.ipi-col{
  color:var(--ipi-ink); background:transparent;
  border-left:1px solid var(--ipi-border);
}
td.commission-value.ipi-col{background:transparent; color:var(--ipi-ink);}

/* ===== Custo (só Gerência) — informativo, nunca editável aqui =====
   O único lugar que altera custo é a "Matriz de custos". */
td.cost-col{
  text-align:right; white-space:nowrap;
  font-size:11.5px; font-weight:600;
  color:var(--cost-ink); background:transparent;
  border-left:1px solid var(--cost-border);
}
th.cost-col{
  color:var(--cost-ink); background:transparent;
  border-left:1px solid var(--cost-border); font-weight:700;
}
td.commission-value.cost-col{background:transparent; color:var(--cost-ink);}

/* ===== Simulação (só Gerência, nunca no PDF) ===== */
.sim-col{
  background:transparent;
  border-left:1px solid var(--wine-soft);
}
th.sim-col{color:var(--wine-ink);}
th.sim-col + th.sim-col, td.sim-col + td.sim-col{border-left:1px solid var(--line-2);}
td.sim-col{text-align:right; white-space:nowrap; padding-left:5px; padding-right:5px;}
/* Cabeçalhos da simulação podem quebrar em duas linhas: assim as colunas
   ficam estreitas em vez de esticadas pelo tamanho do rótulo. */
th.sim-col{
  padding-left:6px !important; padding-right:6px !important;
  font-size:9px; white-space:normal !important; line-height:1.25;
}
th.sim-col .tier-pct{font-size:9.5px;}
/* A coluna que abriga a chave de modo precisa caber a chave inteira. */
.price-table th.sim-col.sim-group-head{width:auto; min-width:158px;}
.price-table th.sim-col.sim-group-head.collapsed{width:44px; min-width:0;}
/* Linha sem alteração/seleção: dados apagados, para deixar claro que o valor
   ainda não está sendo considerado. Ao editar (ou escolher o preço para o
   orçamento) ela volta ao contraste normal. */
td.sim-col.sim-dim{opacity:.6;}
td.sim-col.sim-dim input.sim-input{color:var(--ink-3);}
td.sim-col:not(.sim-dim){background:color-mix(in srgb, var(--wine) 4%, transparent);}
input.sim-input{
  width:58px; text-align:right;
  font:inherit; font-size:12px; font-weight:700;
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif;
  color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:6px; padding:4px;
}
input.sim-input:focus{outline:2px solid var(--wine-soft); outline-offset:-1px;}
/* Sem as setinhas do input numérico: o campo cabe em bem menos largura */
input.sim-input::-webkit-outer-spin-button,
input.sim-input::-webkit-inner-spin-button,
table.coef-table input::-webkit-outer-spin-button,
table.coef-table input::-webkit-inner-spin-button,
.coef-top-field input::-webkit-outer-spin-button,
.coef-top-field input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
input.sim-input, table.coef-table input, .coef-top-field input{appearance:textfield; -moz-appearance:textfield;}
input.sim-input.changed{border-color:var(--wine-ink); background:var(--card);
  box-shadow:inset 0 0 0 1px var(--wine-soft);}
input.sim-input.sim-comm{width:44px;}
.sim-pct{font-size:10px; color:var(--ink-3); margin-left:2px;}
td.sim-margin{font-weight:700; color:var(--ink-2);}
td.sim-margin.changed{color:var(--wine-ink);}
td.sim-margin.negative{color:var(--neg);}
.sim-legend{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:9px 0 0; font-size:11px; color:var(--ink-3);
}

/* ===== Seleção de itens/colunas para orçamento ===== */
.quote-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:11px;}
.quote-count{font-size:11.5px; font-weight:700; color:var(--wine-ink);}
/* Botão "marcar/limpar toda a coluna" no cabeçalho de cada tabela de preço.
   Fica acima do rótulo da coluna e some na impressão. */
.col-pick{
  display:block; margin:0 0 3px auto;
  font:inherit; font-size:8px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; white-space:nowrap;
  border:1px solid var(--line); border-radius:20px;
  background:transparent; color:var(--ink-2);
  padding:1px 7px; cursor:pointer; line-height:1.5;
  transition:border-color .12s ease, color .12s ease;
}
.col-pick:hover{border-color:var(--wine-ink); color:var(--wine-ink);}
.col-pick.on{border-color:var(--wine-ink); color:var(--wine-ink);
  background:color-mix(in srgb, var(--wine) 8%, transparent);}

th.sel-col, td.sel-col{
  width:34px; text-align:center !important;
  padding-left:6px !important; padding-right:6px !important;
}
input.sel-check{width:15px; height:15px; accent-color:var(--wine); cursor:pointer; vertical-align:middle;}
/* Linha escolhida: um véu, não um bloco de cor */
tr.row-selected td{background:color-mix(in srgb, var(--wine) 4%, transparent) !important;}

/* ===== Célula escolhida para o orçamento =====
   Contorno, nunca preenchimento: a marcação é uma referência de borda na cor
   do documento. */
td.pick-cell{cursor:pointer; position:relative;
  transition:box-shadow .12s ease, color .12s ease, background .12s ease;}
td.pick-cell:not(.picked):hover{
  background:color-mix(in srgb, var(--wine) 8%, transparent) !important;
  box-shadow:inset 0 0 0 1px var(--line);
}
/* Marcado: contorno + número na cor do documento. Sem preenchimento chapado e
   sem símbolo dentro da célula — quem confirma a ação é o aviso de marcação. */
td.pick-cell.picked{
  background:color-mix(in srgb, var(--wine) 7%, transparent) !important;
  color:var(--wine-ink) !important; font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--wine-ink);
}
td.pick-cell.picked::after{content:none;}
td.sim-pick{text-align:right;}
td.sim-pick.picked{background:color-mix(in srgb, var(--wine) 7%, transparent) !important;}
td.sim-pick.picked::after{content:none;}
button.pick-dot{
  width:16px; height:16px; margin-right:3px; vertical-align:middle;
  border:1px solid var(--line); border-radius:50%;
  background:var(--card); color:transparent;
  font-size:11px; font-weight:700; line-height:1; cursor:pointer; padding:0;
  display:inline-grid; place-items:center;
}
button.pick-dot .ico{width:9px; height:9px; stroke-width:2.4;}
td.sim-pick.picked button.pick-dot{border-color:var(--wine-ink); color:var(--wine-ink);}
button.pick-dot:hover{border-color:var(--wine-ink); color:var(--wine-ink);}

/* ===== Chave "margem pelo preço" / "preço pela margem" =====
   Dentro do cabeçalho da tabela os dois botões ficam EMPILHADOS (ocupam
   bem menos largura); o selecionado usa o verde de confirmação. */
.sim-mode-switch{
  display:inline-flex; flex-direction:column; align-items:stretch;
  background:var(--card); border:1px solid var(--line);
  border-radius:8px; padding:2px; gap:2px; margin:4px 0 2px; max-width:100%;
}
.sim-mode-opt{
  font:inherit; font-size:9.5px; font-weight:700;
  text-transform:none; letter-spacing:0; color:var(--ink-2);
  border:0; background:transparent; border-radius:6px;
  padding:3px 6px; white-space:nowrap; text-align:center; cursor:pointer;
}
.sim-mode-opt.on{background:var(--sim-sel); color:#fff;}
.sim-mode-opt:hover:not(.on){color:var(--wine-ink); background:var(--sunk);}
td.sim-out{text-align:right; font-weight:700; color:var(--ink-2);}
td.sim-out.changed{color:var(--wine-ink);}
td.sim-out.negative{color:var(--neg); font-size:11px;}
td.sim-out.pick-cell::after{left:5px;}
input.sim-input.sim-margin-in{width:46px;}
button.sim-clear{
  margin-left:3px; width:15px; height:15px; padding:0; vertical-align:middle;
  border:1px solid var(--line); border-radius:50%;
  background:var(--card); color:var(--ink-3);
  font-size:9px; font-weight:700; line-height:1; cursor:pointer; opacity:.45;
}
button.sim-clear:hover{opacity:1; border-color:var(--wine-ink); color:var(--wine-ink);}
button.sim-clear.on{opacity:1; border-color:var(--wine-soft); color:var(--wine-ink); background:var(--sunk);}

/* Atalho de simulação no painel de filtros (essencial no celular) */
.filters-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.sim-ctl{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.sim-ctl .sim-ctl-toggle{font-weight:700;}
/* No atalho fora da tabela há largura de sobra: mantém lado a lado */
.sim-ctl .sim-mode-switch{margin:0; flex-direction:row;}
.sim-ctl .sim-mode-opt{font-size:11px; padding:4px 9px;}
/* O atalho da barra de filtros e a chave dentro do cabeçalho são a mesma
   chave: o escolhido é vinho nos dois, não verde em um e vinho no outro. */
.sim-mode-opt.on{background:var(--wine); color:#fff;}
.sim-mode-opt:hover:not(.on){color:var(--wine-ink); background:var(--sunk);}

/* ===== Grupo de simulação recolhível no cabeçalho da tabela =====
   ABERTO: botão com contorno (chave "«" convida a recolher).
   RECOLHIDO: botão preenchido em vinho, para ficar óbvio que é um controle
   fechado que precisa de clique para abrir (chave "»"). */
th.sim-group-head.collapsed{
  width:40px; padding:4px 3px !important;
  background:transparent; text-align:center !important;
}
/* Recolhido, o rótulo sai da tela (continua para leitor de tela): escrito na
   vertical ele custava ~75px de altura no cabeçalho de TODAS as tabelas. */
th.sim-group-head.collapsed .sgl{
  position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%);
}
button.sim-group-btn{
  font:inherit; font-size:10.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--wine-soft); background:var(--card); color:var(--wine-ink);
  padding:4px 9px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
button.sim-group-btn:hover{background:var(--wine); color:#fff;}
th.sim-group-head.collapsed button.sim-group-btn{
  display:inline-grid; place-items:center;
  width:24px; height:24px; padding:0; border-radius:50%;
  background:color-mix(in srgb, var(--wine) 8%, transparent);
  color:var(--wine-ink); border-color:var(--wine-ink);
}
th.sim-group-head.collapsed button.sim-group-btn .ico{width:12px; height:12px;}
th.sim-group-head.collapsed button.sim-group-btn:hover{background:var(--wine-soft);}

/* ===== Módulo recolhível "Visualizar simulação" ===== */
.sim-toggle{
  display:flex; align-items:center; gap:9px; width:100%;
  background:transparent; border:0; padding:0; cursor:pointer; text-align:left;
}
.sim-toggle .panel-title{margin:0;}
.sim-chevron{color:var(--wine-ink); font-size:12px; line-height:1; transition:transform .15s ease;}
.sim-toggle[aria-expanded="true"] .sim-chevron{transform:rotate(90deg);}
.sim-state{
  margin-left:auto; font-size:11px; font-weight:600; color:var(--ink-3);
  background:var(--chip); border:1px solid var(--line);
  padding:4px 10px; border-radius:20px;
}
.sim-toggle[aria-expanded="true"] .sim-state{
  color:var(--wine-ink);
  background:color-mix(in srgb, var(--wine) 9%, transparent);
  border-color:color-mix(in srgb, var(--wine) 30%, transparent);
}
.sim-body[hidden]{display:none;}

/* ===== Painel recolhível genérico (bloco "Orçamento") =====
   Recolhido mostra só o título e o botão de expandir. */
.collapse-head{margin-bottom:-11px; padding-bottom:9px; border-bottom:1px solid transparent;}
.collapse-head.open{margin-bottom:11px; padding-bottom:8px; border-bottom:2px solid var(--wine-soft);}
.collapse-toggle{
  display:flex; align-items:center; gap:9px; flex:1 1 auto; min-width:0;
  background:transparent; border:0; padding:0; cursor:pointer; text-align:left;
}
.collapse-toggle .panel-title{margin:0;}
.collapse-chevron{
  color:var(--wine-ink); font-size:12px; line-height:1;
  transition:transform .15s ease; flex:0 0 auto;
}
.collapse-toggle[aria-expanded="true"] .collapse-chevron{transform:rotate(90deg);}
.collapse-btn{
  margin-left:auto; flex:0 0 auto;
  font:inherit; font-size:11px; font-weight:700; letter-spacing:.04em;
  color:var(--wine-ink); background:transparent; border:1px solid var(--wine-ink);
  padding:5px 12px; border-radius:8px; white-space:nowrap;
}
.collapse-toggle[aria-expanded="true"] .collapse-btn{
  color:#fff; background:var(--wine); border-color:var(--wine);
}
.collapse-badge{
  flex:0 0 auto; font-size:11px; font-weight:700; color:var(--wine-ink);
  background:color-mix(in srgb, var(--wine) 9%, transparent);
  border:1px solid color-mix(in srgb, var(--wine) 26%, transparent);
  padding:3px 10px; border-radius:20px; white-space:nowrap;
}
.collapse-badge:empty{display:none;}
.collapse-body[hidden]{display:none;}

.empty-state{text-align:center; padding:44px 20px; color:var(--ink-3); font-size:12.5px;}

/* ===== Rodapé de condições ===== */
.footnotes{
  margin-top:0;
  background:var(--wine-deep);
  color:#F2E4E6;
  border-radius:10px;
  padding:12px 14px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px 16px;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.footnote-item .flabel{
  font-size:9.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:#E3A8AF; margin-bottom:3px;
}
.footnote-item .fval{font-size:11.5px; line-height:1.45;}

.hub-footer{text-align:center; padding:18px; font-size:11px; color:var(--ink-3);}

/* ===== Modal de senha ===== */
.modal-overlay{
  position:fixed; inset:0; z-index:98;
  display:grid; place-items:center; padding:18px;
  background:var(--overlay); backdrop-filter:blur(2px);
}
.modal-overlay[hidden]{display:none;}
.modal-box{
  background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:22px 20px 18px;
  width:min(380px,100%);
  box-shadow:0 8px 40px rgba(0,0,0,.28);
}
.modal-box h3{
  margin:0 0 6px; font:inherit; font-size:12px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--wine-ink);
  display:flex; align-items:center; gap:7px;
}
.modal-box p{font-size:12px; color:var(--ink-2); line-height:1.45; margin:0 0 14px;}
.modal-actions{display:flex; gap:8px; margin-top:14px;}
.modal-actions .btn{flex:1;}
.pw-error{color:var(--neg); font-size:11.5px; font-weight:600; margin-top:9px; display:none;}


/* ===== Iconografia: SVG de traço fino, herdando a cor do texto ===== */
.ico{
  width:15px; height:15px; flex:none; display:inline-block; vertical-align:-3px;
  fill:none; stroke:currentColor; stroke-width:1.5;
  stroke-linecap:round; stroke-linejoin:round;
}
.ico.sm{width:12px; height:12px; vertical-align:-2px;}
.btn .ico{margin-right:5px;}
.collapse-chevron .ico, .sim-chevron .ico{width:13px; height:13px; vertical-align:-2px;}
/* Máscaras usadas onde só existe pseudo-elemento (sem nó para um <svg>) */
:root{
  --mask-check:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>');
  --mask-lock:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>');
}

/* ===== Chave de modo da simulação, dentro do cabeçalho =====
   Um segmentado igual aos demais do design system: os dois modos lado a lado,
   mesmo peso visual, e o escolhido preenchido em vinho — no lugar da barra
   verde que ocupava a largura toda e desequilibrava as duas opções. */
th.sim-col .sim-mode-switch{
  display:flex; flex-direction:row; width:100%; max-width:none;
  box-sizing:border-box; margin:3px 0 2px;
  background:var(--chip); border:1px solid var(--line);
  border-radius:7px; padding:2px; gap:2px;
}
th.sim-col .sim-mode-opt{
  flex:1 1 0; min-width:0; white-space:nowrap;
  font-size:8.5px; font-weight:600; letter-spacing:0; text-transform:none;
  color:var(--ink-2); background:transparent;
  border:0; border-radius:5px; padding:3px 5px; line-height:1.25;
}
th.sim-col .sim-mode-opt.on{background:var(--wine); color:#fff; font-weight:700;}
th.sim-col .sim-mode-opt:hover:not(.on){color:var(--wine-ink); background:var(--card);}
/* O "voltar" do grupo vira uma etiqueta discreta, não um botão pesado */
th.sim-group-head:not(.collapsed) button.sim-group-btn{
  display:inline-flex; align-items:center; gap:3px;
  font-size:8.5px; letter-spacing:.09em;
  border:0; background:transparent; color:var(--ink-2);
  padding:1px 2px; border-radius:6px;
}
th.sim-group-head:not(.collapsed) button.sim-group-btn:hover{
  background:transparent; color:var(--wine-ink);
}
th.sim-group-head:not(.collapsed) button.sim-group-btn .ico{width:10px; height:10px;}

/* A busca virou o último controle do painel: sozinha na linha, ela esticaria
   pelos 1900px da tela. Um campo de busca não precisa disso. */
.field.search-field{flex:0 1 560px; max-width:560px;}

/* ===== Coluna de administração (só Gerência, nunca no papel) =====
   Olho = aparece ou não na tabela do Representante. Setas = ordem dentro da
   família. As duas coisas vivem no banco, não no navegador: o que o gestor
   decide aqui é o que o representante abre depois. */
th.adm-col, td.adm-col{
  width:71px; min-width:71px; white-space:nowrap; text-align:left !important;
  padding-left:6px !important; padding-right:3px !important;
}
.adm-ctl{display:inline-flex; align-items:center; gap:1px;}
.adm-ctl button{
  display:inline-grid; place-items:center;
  width:21px; height:21px; padding:0;
  border:1px solid transparent; border-radius:6px;
  background:transparent; color:var(--ink-3); cursor:pointer;
  transition:color .12s ease, background .12s ease, border-color .12s ease;
}
.adm-ctl button:hover:not(:disabled){
  color:var(--wine-ink);
  background:color-mix(in srgb, var(--wine) 9%, transparent);
  border-color:color-mix(in srgb, var(--wine) 26%, transparent);
}
.adm-ctl button:disabled{opacity:.22; cursor:default;}
.adm-ctl button.ocupado{opacity:.4; cursor:progress;}
.adm-ctl .adm-eye.off{color:var(--neg);}
.adm-ctl .ico{width:13px; height:13px;}
.adm-ctl .adm-move .ico{width:11px; height:11px;}
/* Linha que o representante não vê: fica em segundo plano, mas legível */
tr.row-oculto td{opacity:.48;}
tr.row-oculto td.adm-col{opacity:1;}
tr.row-oculto td.code{text-decoration:line-through; text-decoration-thickness:1px;}

/* ===== Coeficientes: simular, atribuir, publicar =====
   Com edição pendente o resto da tela sai de foco: o que está em jogo é só a
   tabela de coeficientes, e a barra do rodapé é a única saída. */
body.coef-foco .wgi-header,
body.coef-foco .page > *:not(#coefPanel),
body.coef-foco .hub-footer{
  filter:blur(3px); opacity:.5;
  pointer-events:none; user-select:none;
}
body.coef-foco #coefPanel{
  position:relative; z-index:60;
  box-shadow:0 0 0 2px var(--s2), 0 12px 44px rgba(0,0,0,.18);
}
/* Trocar de versão no meio de uma edição perderia o que foi digitado. */
body.coef-foco .coef-tabs{pointer-events:none; opacity:.45;}

#coefBar{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  z-index:125; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:var(--card); color:var(--ink);
  border:1px solid var(--line); border-left:3px solid var(--s2);
  border-radius:12px; box-shadow:0 12px 44px rgba(0,0,0,.24);
  padding:11px 16px; max-width:calc(100vw - 24px);
}
#coefBar[hidden]{display:none !important;}
#coefBar .cb-txt{font-size:12px; font-weight:700; line-height:1.35;}
#coefBar .cb-txt small{
  display:block; font-size:11px; font-weight:500; color:var(--ink-2); margin-top:2px;
}
#coefBar .cb-acoes{display:flex; gap:8px; margin-left:auto;}

/* Atribuído e ainda no forno: o aviso deixa de ser uma linha discreta */
.coef-alerta{
  display:flex; align-items:flex-start; gap:10px;
  margin:12px 0 0; padding:10px 13px;
  background:color-mix(in srgb, var(--s2) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--s2) 45%, transparent);
  border-left:3px solid var(--s2);
  border-radius:9px;
  font-size:11.5px; line-height:1.45; color:var(--ink);
}
.coef-alerta .ico{color:var(--s2); flex:none; margin-top:1px;}
.coef-alerta[hidden]{display:none !important;}
@media (max-width:720px){
  #coefBar{left:12px; right:12px; transform:none; max-width:none;}
  #coefBar .cb-acoes{margin-left:0; width:100%;}
  #coefBar .cb-acoes .btn{flex:1; justify-content:center;}
}
@media print{
  body.coef-foco .wgi-header,
  body.coef-foco .page > *,
  body.coef-foco .hub-footer{filter:none !important; opacity:1 !important;}
  #coefBar, .coef-alerta{display:none !important;}
}

/* ===== Aviso de marcação de célula (toast) ===== */
#toastWrap{
  position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
  z-index:120; display:flex; flex-direction:column; align-items:center;
  gap:8px; pointer-events:none; width:max-content; max-width:calc(100vw - 24px);
}
.toast{
  display:flex; align-items:center; gap:9px;
  background:var(--card); color:var(--ink);
  border:1px solid var(--line); border-left:3px solid var(--wine-ink);
  border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,.18);
  padding:9px 14px; font-size:12px; font-weight:600; letter-spacing:.01em;
  white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis;
  animation:toast-in .18s ease both;
}
.toast .ico{color:var(--wine-ink);}
.toast b{font-weight:700; font-family:"Archivo Narrow",Archivo,Arial,sans-serif;}
.toast .tsep{color:var(--ink-3); font-weight:400;}
.toast .tcount{
  margin-left:2px; padding-left:9px; border-left:1px solid var(--line);
  font-size:11px; font-weight:700; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.toast.off{border-left-color:var(--ink-3);}
.toast.off .ico{color:var(--ink-3);}
.toast.leaving{animation:toast-out .16s ease both;}
@keyframes toast-in{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
@keyframes toast-out{to{opacity:0; transform:translateY(6px) scale(.98);}}
@media (prefers-reduced-motion:reduce){.toast,.toast.leaving{animation:none;}}

/* ===== Celular: uma ficha por produto =====
   Abaixo de 720px a tabela de colunas dá lugar a uma ficha por produto: o
   cabeçalho da ficha traz código, cor e IPI; embaixo, UMA LINHA POR TABELA de
   preço, com a comissão daquela tabela ao lado; e no rodapé da ficha, custo e
   simulação. A comissão vem do atributo data-comm que o render grava em cada
   célula de preço — CSS não consegue puxar a linha de comissões do rodapé.
   Os rótulos de cada linha saem do data-label, que já existia. */
@media (max-width:720px){
  .cat-block{width:auto;}
  .cat-heading{padding:6px 10px 5px;}
  .cat-heading h2{font-size:11px; letter-spacing:.06em;}
  .cat-count{font-size:9.5px;}

  table.price-table{display:block; width:100%; table-layout:auto; font-size:11px;}
  .price-table thead{display:none;}
  .price-table tbody{display:block;}
  /* A linha de comissões do rodapé sai: a comissão passou a viver em cada
     linha de preço da ficha. */
  .price-table tbody tr.commission-row{display:none;}

  .price-table tbody tr{
    display:grid; grid-template-columns:auto 1fr auto auto;
    align-items:baseline;
    padding:6px 10px 7px;
    border-top:1px solid var(--line-2);
  }
  .price-table tbody tr:first-child{border-top:0;}
  /* Fundo por linha, nunca por célula solta */
  .price-table tbody tr:nth-child(even) td,
  .price-table tbody tr.row-selected td{background:transparent !important;}
  .price-table tbody tr:nth-child(even){background:color-mix(in srgb, var(--ink) 2.5%, transparent);}
  .price-table tbody tr.row-selected{
    background:color-mix(in srgb, var(--wine) 5%, transparent);
    box-shadow:inset 2px 0 0 var(--wine-ink);
  }
  .price-table tbody tr:hover td{background:transparent;}
  .price-table tbody tr:last-child td:first-child,
  .price-table tbody tr:last-child td:last-child{border-radius:0;}

  .price-table tbody td{
    padding:1px 0; border:0 !important; text-align:right;
    min-width:0; white-space:nowrap;
  }
  /* --- cabeçalho da ficha: código | cor | IPI, todos na linha 1 ---
     O grid-row explícito é necessário: o IPI é a última célula do DOM e, sem
     ele, a colocação automática jogaria o IPI para depois dos preços. */
  .price-table tbody td.code{
    grid-column:1; grid-row:1; text-align:left;
    font-size:12.5px; padding-bottom:3px;
  }
  .price-table tbody td.color-cell{
    grid-column:2; grid-row:1; text-align:left; padding-left:10px;
    font-size:10.5px; color:var(--ink-2);
  }
  .price-table tbody td.color-cell .swatch{width:7px; height:7px; margin-right:5px;}
  .price-table tbody td.ipi{
    grid-column:3; grid-row:1;
    font-size:10.5px; color:var(--ink-2); font-weight:600;
  }
  /* Controles de gestão no canto da primeira linha da ficha */
  .price-table tbody td.adm-col{
    grid-column:4; grid-row:1; justify-self:end;
    padding:0 0 0 8px !important;
  }
  .adm-ctl button{width:24px; height:24px;}
  .price-table tbody td.ipi::before{
    content:attr(data-label) " "; font-size:8.5px; font-weight:700;
    letter-spacing:.07em; color:var(--ink-2);
    font-family:"Archivo",Arial,sans-serif;
  }
  /* --- uma linha por tabela: rótulo | preço | comissão --- */
  .price-table tbody td.price{
    grid-column:1 / -1;
    display:grid; grid-template-columns:1fr auto auto;
    align-items:baseline; gap:0 10px;
    font-size:12px;
  }
  .price-table tbody td.price::before{
    content:attr(data-label);
    font-family:"Archivo",Arial,sans-serif;
    font-size:8.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-2); text-align:left;
    overflow:hidden; text-overflow:ellipsis;
  }
  .price-table tbody td.price::after{
    content:attr(data-comm);
    font-family:"Archivo",Arial,sans-serif;
    font-size:9.5px; font-weight:600; color:var(--ink-2);
    min-width:40px; text-align:right;
  }
  .price-table tbody td.price[data-comm=""]::after{content:"";}
  /* --- rodapé da ficha: custo e simulação --- */
  .price-table tbody td.cost-col,
  .price-table tbody td.sim-col{
    grid-column:1 / -1;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:11px;
  }
  .price-table tbody td.cost-col::before,
  .price-table tbody td.sim-col::before{
    content:attr(data-label);
    font-family:"Archivo",Arial,sans-serif;
    font-size:8.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-2); text-align:left;
    overflow:hidden; text-overflow:ellipsis;
  }
  /* No DOM a simulação vem antes do custo; na ficha a ordem pedida é custo e
     depois simulação. Em grid, 'order' resolve sem mexer no render. */
  .price-table tbody td.cost-col{
    order:1; margin-top:4px; padding-top:4px;
    border-top:1px solid var(--line-2) !important;
  }
  .price-table tbody td.sim-col{order:2;}
  /* Sem custo (Representante), o traço de separação fica na simulação */
  .price-table tbody td.sim-col:first-of-type{margin-top:4px;}
  /* Grupo recolhido: a célula vazia que só segura o lugar da coluna some */
  .price-table tbody td.sim-col:empty{display:none;}
  .price-table tbody td.sim-col.sim-dim{opacity:.7;}
  input.sim-input{width:66px; font-size:11px; padding:3px 5px; border-radius:6px;}
  input.sim-input.sim-comm, input.sim-input.sim-margin-in{width:52px;}
  button.sim-clear{width:14px; height:14px; font-size:8px;}
  button.pick-dot{width:14px; height:14px; margin-right:3px;}

  /* Marcado: contorno em volta da linha do preço */
  .price-table tbody tr.row-selected td.pick-cell.picked,
  .price-table tbody td.pick-cell.picked{
    background:color-mix(in srgb, var(--wine) 7%, transparent) !important;
    box-shadow:inset 0 0 0 1.2px var(--wine-ink);
    border-radius:6px; padding:2px 7px !important;
  }
  td.pick-cell:not(.picked):hover{box-shadow:none; background:transparent !important;}

  /* Cabeçalho do painel recolhível: título numa linha, contador e botão na
     linha de baixo — em vez de espremer o título em três linhas. */
  .collapse-toggle{flex-wrap:wrap; row-gap:7px;}
  .collapse-toggle .panel-title{flex:1 1 auto; min-width:0;}
  .collapse-badge{order:2;}
  .collapse-btn{order:3;}
  /* O aviso precisa caber na largura do celular: quebra em duas linhas em vez
     de vazar pela borda. */
  #toastWrap{bottom:14px; left:12px; right:12px; transform:none;
    width:auto; max-width:none; align-items:stretch;}
  .toast{
    font-size:12px; padding:9px 12px;
    white-space:normal; flex-wrap:wrap; row-gap:2px;
  }
  .toast .tcount{margin-left:auto; padding-left:0; border-left:0;}
}
/* Telas bem estreitas: só aperta as margens da página */
@media (max-width:430px){
  .page{padding-left:7px; padding-right:7px;}
  .price-table tbody tr{padding:5px 9px 6px;}
  .price-table tbody td.color-cell{padding-left:8px;}
}

@media (max-width:640px){
  .page{padding:10px 10px 30px; gap:10px;}
  .panel{padding:10px 11px 12px;}
  .panel-title-row{margin:-10px -11px 10px; padding:8px 11px 7px;}
  .collapse-head{margin-bottom:-10px;}
  .collapse-head.open{margin-bottom:10px;}
  .brand-text h1{font-size:16px;}
  .logo-badge{width:32px; height:32px;}
  /* A tabela continua com o mesmo layout do desktop — o JS encolhe cada
     bloco de categoria (via CSS zoom) até caber na largura da tela,
     em vez de reformatar em "cards" empilhados. */
  .cat-block{transform-origin:top left;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}

/* ===== Impressão: A4 RETRATO, tudo em UMA página, números na maior fonte
   possível. Os tamanhos abaixo são fixos e calibrados para o catálogo
   completo (43 produtos + 4 famílias) caber em uma folha. ===== */
@page{size:A4 portrait; margin:8mm;}
@media print{
  /* A impressão é sempre no tema claro, mesmo com dark mode ligado. */
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]){
    --wine:#7C1B29; --wine-deep:#5E1220; --wine-soft:#A5303F;
    --bg:#FFFFFF; --card:#FFFFFF; --sunk:#F5F4F2;
    --ink:#26252A; --ink-2:#5A555C; --ink-3:#8B858E;
    --line:#C9C5C1; --line-2:#E3E0DD;
    --s1:#9E2438; --s2:#B8801F; --s3:#1E6FB8; --s4:#4E7A1E;
    --pos:#2C6B4F; --neg:#A33A2A; --chip:#F2F0ED; --wine-ink:#7C1B29;
    --cat-6-border:#7C1B29; --cat-7-border:#8E4450;
    --cat-8-border:#A07079; --cat-9-border:#B49BA0;
    --ipi-ink:#5A555C; --ipi-border:#C9C5C1;
    --cost-ink:#8B858E; --cost-border:#DAD7D3;
  }
  /* A calibração de "tudo em uma página" depende de entrelinha curta e de
     bordas colapsadas — o line-height 1.4 da tela custaria uma folha extra. */
  body{background:#fff; line-height:1.2;}
  .no-print{display:none !important;}
  .wgi-header{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
    background:var(--wine) !important; padding:6px 10px; position:static;
  }
  .cat-heading{position:static !important; background:transparent !important;}
  .logo-badge{width:34px; height:34px; border-width:1px; padding:2px;}
  .brand-text h1{font-size:15px !important; margin:0;}
  .brand-text p{font-size:9px;}
  .page{padding:0; gap:0; max-width:none; display:block;}
  .panel{box-shadow:none; border:none; padding:0; margin:0;}
  /* Título da tabela com o ICMS aplicável em destaque */
  .print-summary{
    display:block; font-size:16px; font-weight:700;
    color:var(--wine-deep); text-align:center;
    text-transform:uppercase; letter-spacing:.06em;
    margin:4px 0 5px; padding-bottom:3px;
    border-bottom:3px solid var(--wine);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .print-summary .icms-badge{font-size:16px; padding:3px 13px;}
  /* Blocos de categoria compactos */
  .cat-block{margin:0 0 3.5px; break-inside:avoid-page; overflow:visible;
    border:0; border-left:2.5px solid var(--cat-accent); border-radius:0;}
  .cat-heading{margin:0; padding:1.5px 7px; border-radius:0;
    border-bottom:.75pt solid var(--cat-accent); background:transparent;}
  .cat-heading h2{font-size:11.5px; letter-spacing:.07em; line-height:1.15;
    color:var(--cat-accent) !important;}
  .cat-count{font-size:9px;}
  /* Tabelas: fonte máxima que ainda cabe numa página A4 retrato */
  table.price-table{border-collapse:collapse; border-radius:0; border:0; width:100%;}
  .price-table thead th{
    color:#000 !important; font-size:8.5px; padding:1.6px 4px; line-height:1.15;
    background:transparent !important;
    border-bottom:.75pt solid #999; letter-spacing:.03em;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .price-table thead th .tier-pct{font-size:9.5px; margin-top:0; color:#7C1B29 !important;}
  .price-table tbody td{padding:1px 4px; font-size:10.5px; line-height:1.15;
    border-top:.4pt solid #ddd;}
  .price-table tbody tr:first-child td{border-top:0;}
  .price-table tbody tr:nth-child(even) td{background:#f7f7f7 !important;}
  .price-table tbody tr:hover td{background:transparent;}
  .price-table tbody tr.commission-row td{
    background:transparent !important; padding-top:1.2px; padding-bottom:1.2px;
    border-top:.75pt solid #999; color:#7C1B29 !important;
  }
  td.code{font-size:10.5px;}
  td.color-cell{font-size:10px;}
  td.color-cell .swatch{width:7px; height:7px; margin-right:4px;}
  td.price{font-size:12px;}   /* os números — maior fonte da tabela */
  tr.commission-row td{font-size:10.5px; padding:1.4px 4px; line-height:1.15;}
  tr.commission-row td.commission-label{font-size:8.5px;}
  tr{break-inside:avoid;}
  /* Rodapé de condições — compacto, e sem a referência em USD */
  .footnotes{
    background:#fff !important; color:#000 !important;
    border:1px solid #999; border-radius:0;
    padding:2.5px 8px; gap:2px 10px; margin-top:3px; break-inside:avoid;
    grid-template-columns:repeat(4,1fr);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .footnote-item .flabel{color:#555 !important; font-size:7px; margin-bottom:1px;}
  .footnote-item .fval{color:#000 !important; font-size:8px; line-height:1.25;}
  .footnote-item.usd-item{display:none !important;}
  /* As colunas de simulação existem só na tela da Gerência — nunca no PDF. */
  .sim-col{display:none !important;}
  .sim-legend{display:none !important;}
  .col-pick{display:none !important;}
  /* Na tela o card tem a largura da tabela; no papel ele ocupa a folha. */
  .cat-block{width:auto !important;}
  /* Item oculto para o representante não entra na folha: o PDF é a lista de
     preços, não o cadastro. Na tela da Gerência ele continua, riscado. */
  tr.row-oculto{display:none !important;}
  /* Nada de destaque de seleção no PDF: o realce de escolha é só de tela.
     Especificidade alta de propósito — as regras de tela usam !important. */
  .price-table tbody tr.row-selected td,
  .price-table tbody tr.row-selected{background:transparent !important;
    box-shadow:none !important;}
  .price-table tbody td.pick-cell.picked,
  td.pick-cell.picked{
    background:transparent !important; color:inherit !important;
    box-shadow:none !important; font-weight:700;
  }
  td.pick-cell.picked::after{content:none !important;}
  #toastWrap{display:none !important;}
  /* IPI mantém o tom próprio na impressão */
  td.ipi{
    font-size:9.5px; font-weight:700;
    color:#5A555C !important; background:transparent !important;
    border-left:.4pt solid #bbb;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  th.ipi-col{
    color:#5A555C !important; background:transparent !important;
    border-left:.4pt solid #bbb;
  }
  td.commission-value.ipi-col{background:transparent !important; color:#5A555C !important;}
  /* Custo (só Gerência) mantém o cinza claro na impressão */
  td.cost-col{
    font-size:9.5px; font-weight:600;
    color:#6B6A6F !important; background:transparent !important;
    border-left:.4pt solid #bbb;
  }
  th.cost-col{
    color:#6B6A6F !important; background:transparent !important;
    border-left:.4pt solid #bbb;
  }
  td.commission-value.cost-col{background:transparent !important; color:#6B6A6F !important;}
}

/* ===== Consulta por item ==========================================
   Uma janela própria, por cima da tela, com a busca dentro: o usuário
   escolhe os itens, consulta as fichas em corpo grande e fecha para
   voltar à tabela. Pensada para o celular — ocupa a tela inteira e
   rola só na vertical. */
.foco-modal{
  position:fixed; inset:0; z-index:150; background:var(--overlay);
  display:flex; align-items:center; justify-content:center;
}
.foco-modal[hidden]{display:none !important;}
body.foco-aberto{overflow:hidden;}
.foco-box{
  background:var(--bg); width:100%; height:100%; max-width:560px;
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 20px 70px rgba(0,0,0,.35);
}
@media (min-width:600px){
  .foco-modal{padding:26px;}
  .foco-box{height:auto; max-height:min(900px,92vh); border-radius:16px;}
}
.foco-box-top{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:13px 14px; background:var(--wine); color:#fff;
}
.foco-box-top h3{
  margin:0; flex:1; min-width:0;
  font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
}
button.foco-x{
  flex:none; width:34px; height:34px; border-radius:50%; padding:0; cursor:pointer;
  border:1px solid rgba(255,255,255,.4); background:rgba(0,0,0,.18); color:#fff;
  font:700 14px/1 Archivo,Arial,sans-serif;
  display:flex; align-items:center; justify-content:center;
}

<script>
  // A impressão em A4 RETRATO usa tamanhos fixos definidos no @media print do
  // CSS (calibrados para o catálogo inteiro caber em uma página, com os números
  // na maior fonte possível). Antes de imprimir só precisamos remover o zoom que
  // a adaptação de tela (celular) aplica nos blocos, para não interferir.
  function prepareTablesForPrint(){
    document.querySelectorAll('.cat-block').forEach(b=>{ b.style.zoom = ''; });
  }
  function resetTablesZoom(){
    // Restaura a adaptação de tela do celular, se aplicável.
    if(typeof fitTablesToScreen === 'function') fitTablesToScreen();
  }
  window.addEventListener('beforeprint', prepareTablesForPrint);
  window.addEventListener('afterprint', resetTablesZoom);

  // Mesma técnica, agora para telas estreitas (celular): em vez de reformatar
  // a tabela em "cards" empilhados, ela mantém o layout idêntico ao desktop e
  // é encolhida (zoom) até caber na largura disponível, sem cortar colunas.
  // A tabela nunca precisa de rolagem lateral: em QUALQUER largura de tela
  // (desktop, tablet ou celular) ela é encolhida até caber no espaço
  // disponível, mantendo o mesmo layout de colunas. Isso vale especialmente
  // quando o grupo de simulação é aberto e surgem 3 colunas a mais.
  // Altura do header fixo -> --hdr-h. É de onde o título congelado da família
  // se pendura.
  function medirHeader(){
    const h = document.querySelector('.wgi-header');
    if(h) document.documentElement.style.setProperty('--hdr-h', h.offsetHeight + 'px');
    return h ? h.offsetHeight : 58;
  }
  let fitRaf = null;
  function fitTablesToScreen(){
    const hdrH = medirHeader();
    const blocks = document.querySelectorAll('.cat-block');
    // Mede sempre sem zoom aplicado, senão a medida vem contaminada
    blocks.forEach(b=>{ b.style.zoom = ''; });
    void document.body.offsetWidth; // força reflow antes de medir
    blocks.forEach(b=>{
      const table = b.querySelector('table.price-table');
      if(!table) return;
      const cs = getComputedStyle(b);
      const padX = parseFloat(cs.paddingLeft || 0) + parseFloat(cs.paddingRight || 0);
      const available = b.clientWidth - padX;
      // scrollWidth da tabela = largura mínima que o conteúdo exige
      const natural = table.scrollWidth;
      let scale = 1;
      if(available > 0 && natural > available + 1){
        scale = Math.max(0.16, available / natural);
        b.style.zoom = scale.toFixed(3);
      }
      // O zoom encolhe também o "top" do sticky: sem dividir pela escala, o
      // título congelaria por baixo do header.
      b.style.setProperty('--cat-sticky-top', (hdrH / scale).toFixed(1) + 'px');
    });
  }
  function scheduleFitTablesToScreen(){
    if(fitRaf) cancelAnimationFrame(fitRaf);
    fitRaf = requestAnimationFrame(fitTablesToScreen);
  }
  medirHeader();
  window.addEventListener('resize', scheduleFitTablesToScreen);
  window.addEventListener('orientationchange', scheduleFitTablesToScreen);
</script>
